<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Platformer Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #1a1a2e;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #ui {
      display: flex;
      justify-content: space-between;
      width: 800px;
      margin-bottom: 8px;
      font-size: 1.1rem;
      font-weight: bold;
    }
    canvas {
      border: 3px solid #fff;
      background: #5c94fc; /* Classic sky blue */
      display: block;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    #instructions {
      margin-top: 10px;
      font-size: 0.9rem;
      color: #aaa;
    }
  </style>
</head>
<body>

  <div id="ui">
    <span id="scoreDisplay">Score: 0</span>
    <span id="statusDisplay">Use Arrow Keys / A-D to Move & Jump</span>
  </div>

  <canvas id="gameCanvas" width="800" height="400"></canvas>
  <div id="instructions">← / A : Left &nbsp;|&nbsp; → / D : Right &nbsp;|&nbsp; ↑ / W / Space : Jump</div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreDisplay = document.getElementById("scoreDisplay");
    const statusDisplay = document.getElementById("statusDisplay");

    // Game constants
    const GRAVITY = 0.55;
    const FRICTION = 0.82;

    let score = 0;
    let gameOver = false;
    let victory = false;

    // Keys tracker
    const keys = {
      left: false,
      right: false,
      up: false
    };

    window.addEventListener("keydown", (e) => {
      if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = true;
      if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = true;
      if (e.code === "ArrowUp" || e.code === "KeyW" || e.code === "Space") {
        if (!keys.up && player.grounded) {
          player.velocityY = -player.jumpStrength;
          player.grounded = false;
        }
        keys.up = true;
      }
      if (gameOver && e.code === "KeyR") {
        resetGame();
      }
    });

    window.addEventListener("keyup", (e) => {
      if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = false;
      if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = false;
      if (e.code === "ArrowUp" || e.code === "KeyW" || e.code === "Space") keys.up = false;
    });

    // Player Object
    const player = {
      x: 50,
      y: 300,
      width: 24,
      height: 32,
      velocityX: 0,
      velocityY: 0,
      speed: 3.8,
      jumpStrength: 12,
      grounded: false,
      color: "#e52521" // Mario Red
    };

    // Level Design
    const platforms = [
      { x: 0, y: 360, width: 900, height: 40 },       // Ground 1
      { x: 970, y: 360, width: 700, height: 40 },     // Ground 2 (Pit in between)
      { x: 200, y: 270, width: 90, height: 20 },
      { x: 340, y: 210, width: 100, height: 20 },
      { x: 500, y: 270, width: 120, height: 20 },
      { x: 700, y: 200, width: 80, height: 20 },
      { x: 1100, y: 260, width: 120, height: 20 },
      { x: 1300, y: 190, width: 100, height: 20 }
    ];

    let coins = [
      { x: 235, y: 235, collected: false },
      { x: 385, y: 175, collected: false },
      { x: 550, y: 235, collected: false },
      { x: 735, y: 165, collected: false },
      { x: 1150, y: 225, collected: false },
      { x: 1340, y: 155, collected: false }
    ];

    let enemies = [
      { x: 400, y: 336, width: 24, height: 24, speed: -1.2, leftBound: 250, rightBound: 580, alive: true },
      { x: 1150, y: 336, width: 24, height: 24, speed: 1.5, leftBound: 1000, rightBound: 1450, alive: true }
    ];

    // Goal Flag
    const flag = { x: 1550, y: 160, width: 10, height: 200 };

    let cameraX = 0;

    function resetGame() {
      player.x = 50;
      player.y = 300;
      player.velocityX = 0;
      player.velocityY = 0;
      score = 0;
      gameOver = false;
      victory = false;
      cameraX = 0;

      coins.forEach(c => c.collected = false);
      enemies.forEach(e => {
        e.alive = true;
        e.x = e.leftBound;
      });

      scoreDisplay.textContent = `Score: ${score}`;
      statusDisplay.textContent = "Use Arrow Keys / A-D to Move & Jump";
    }

    function update() {
      if (gameOver) return;

      // Handle Horizontal Input
      if (keys.left) player.velocityX = -player.speed;
      if (keys.right) player.velocityX = player.speed;

      // Apply Physics
      player.velocityX *= FRICTION;
      player.velocityY += GRAVITY;

      player.x += player.velocityX;
      player.y += player.velocityY;

      player.grounded = false;

      // Platform Collisions (AABB)
      for (const plat of platforms) {
        if (
          player.x < plat.x + plat.width &&
          player.x + player.width > plat.x &&
          player.y < plat.y + plat.height &&
          player.y + player.height > plat.y
        ) {
          // Landing on top
          if (player.velocityY > 0 && player.y + player.height - player.velocityY <= plat.y + 4) {
            player.y = plat.y - player.height;
            player.velocityY = 0;
            player.grounded = true;
          }
          // Hitting from below
          else if (player.velocityY < 0 && player.y - player.velocityY >= plat.y + plat.height - 4) {
            player.y = plat.y + plat.height;
            player.velocityY = 0;
          }
        }
      }

      // Coins Collection
      coins.forEach((coin) => {
        if (!coin.collected) {
          const distX = (player.x + player.width / 2) - coin.x;
          const distY = (player.y + player.height / 2) - coin.y;
          if (Math.hypot(distX, distY) < 20) {
            coin.collected = true;
            score += 100;
            scoreDisplay.textContent = `Score: ${score}`;
          }
        }
      });

      // Enemy Patrol & Collisions
      enemies.forEach((enemy) => {
        if (!enemy.alive) return;

        enemy.x += enemy.speed;
        if (enemy.x <= enemy.leftBound || enemy.x >= enemy.rightBound) {
          enemy.speed *= -1;
        }

        // Check player overlap
        if (
          player.x < enemy.x + enemy.width &&
          player.x + player.width > enemy.x &&
          player.y < enemy.y + enemy.height &&
          player.y + player.height > enemy.y
        ) {
          // Stomp enemy (falling downwards onto it)
          if (player.velocityY > 0 && player.y + player.height - player.velocityY <= enemy.y + 8) {
            enemy.alive = false;
            player.velocityY = -player.jumpStrength * 0.7; // Bounce off
            score += 200;
            scoreDisplay.textContent = `Score: ${score}`;
          } else {
            // Player dies
            gameOver = true;
            statusDisplay.textContent = "💥 Game Over! Press 'R' to Restart";
          }
        }
      });

      // Check Fall into Pit
      if (player.y > canvas.height + 50) {
        gameOver = true;
        statusDisplay.textContent = "💥 You fell! Press 'R' to Restart";
      }

      // Check Victory Condition
      if (player.x >= flag.x) {
        gameOver = true;
        victory = true;
        statusDisplay.textContent = "🎉 You Won! Press 'R' to Play Again";
      }

      // Smooth Horizontal Camera Tracking
      const targetCamX = player.x - canvas.width * 0.35;
      cameraX += (targetCamX - cameraX) * 0.1;
      cameraX = Math.max(0, cameraX); // Lock camera to the start
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.translate(-cameraX, 0);

      // 1. Draw Platforms (Brick style)
      platforms.forEach((plat) => {
        ctx.fillStyle = "#b84418";
        ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
        // Top grass/highlight edge
        ctx.fillStyle = "#00a800";
        ctx.fillRect(plat.x, plat.y, plat.width, 6);
      });

      // 2. Draw Coins
      coins.forEach((coin) => {
        if (!coin.collected) {
          ctx.beginPath();
          ctx.arc(coin.x, coin.y, 8, 0, Math.PI * 2);
          ctx.fillStyle = "#ffd700";
          ctx.fill();
          ctx.lineWidth = 2;
          ctx.strokeStyle = "#d4af37";
          ctx.stroke();
        }
      });

      // 3. Draw Enemies (Goomba style)
      enemies.forEach((enemy) => {
        if (enemy.alive) {
          ctx.fillStyle = "#795548";
          ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
          // Eyes
          ctx.fillStyle = "#fff";
          ctx.fillRect(enemy.x + 3, enemy.y + 4, 4, 6);
          ctx.fillRect(enemy.x + 15, enemy.y + 4, 4, 6);
        }
      });

      // 4. Draw Goal Pole & Flag
      ctx.fillStyle = "#eee";
      ctx.fillRect(flag.x, flag.y, flag.width, flag.height);
      ctx.fillStyle = "#2ecc71";
      ctx.beginPath();
      ctx.moveTo(flag.x + flag.width, flag.y);
      ctx.lineTo(flag.x + flag.width + 30, flag.y + 15);
      ctx.lineTo(flag.x + flag.width, flag.y + 30);
      ctx.fill();

      // 5. Draw Player
      ctx.fillStyle = player.color;
      ctx.fillRect(player.x, player.y, player.width, player.height);
      // Overalls / Visual flair
      ctx.fillStyle = "#0026ff";
      ctx.fillRect(player.x + 2, player.y + 16, player.width - 4, 16);

      ctx.restore();
    }

    // Main Game Loop
    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
